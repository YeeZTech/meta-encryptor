name: Release

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify project
        run: npm test
      - name: Build, typecheck, and verify package
        run: npm run build && npm run typecheck && npm run verify:pack
      - name: Publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "[ci] release"
          title: "[ci] release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
